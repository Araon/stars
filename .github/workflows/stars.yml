name: update stars

on:
  workflow_dispatch:
  schedule:
    - cron: "30 0 * * *"

permissions:
  contents: write

jobs:
  catalog:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.10"

      - name: install starred
        run: python -m pip install starred==4.3.0

      - name: update catalog
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          starred
          --username "${{ github.repository_owner }}"
          --repository stars
          --sort
          --token "$GITHUB_TOKEN"
          --message "chore: update stars"
          --topic
          --topic_limit 500
